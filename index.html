<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angga Labola</title>
</head>

<style>
        /* Center the heart on the screen */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f9fa;
        }

        /* Style the heart container */
        .heart-emoji {
            font-size: 80px; /* Make the emoji large */
            display: inline-block; /* Required for transform animations to work properly */
            cursor: pointer;
            
            /* Link the animation here */
            /* name | duration | timing-function | iteration-count */
            animation: beat 1.2s ease-in-out infinite; 
        }

        /* Define the movement using CSS Keyframes */
        @keyframes beat {
            0% {
                transform: scale(1); /* Starting size */
            }
            30% {
                transform: scale(1.3); /* Grows bigger quickly */
            }
            60% {
                transform: scale(1.1); /* Drops back slightly */
            }
            80% {
                transform: scale(1.25); /* Second minor pulse */
            }
            100% {
                transform: scale(1); /* Returns to original size */
            }
        }
    </style>

<body>
<img src="photos\Linda.jpg" alt="Linda" height="250" width="150">

    <h1>Halo, Linda Sintawati Dami!</h1>
    <p>I love you so much</p>

 <div class="heart-emoji">❤️</div>

</body>
</html>
